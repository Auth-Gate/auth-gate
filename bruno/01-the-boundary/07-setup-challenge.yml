info:
  name: "Setup: open a PIN challenge (201)"
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/challenges"
  headers:
    - name: Content-Type
      value: "application/json"
    - name: X-Internal-Access-Key
      value: "{{clientKey}}"
  body:
    type: json
    data: |-
      { "subjectId": "{{subjectId}}", "purpose": "boundary", "factor": "pin" }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) bru.setVar("challengeId", res.getBody().challengeId);
    - type: tests
      code: |-
        test("201 — challenge opened", function() {
          expect(res.getStatus()).to.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **Setup, expected: 201.** Captures `challengeId`.
