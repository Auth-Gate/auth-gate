info:
  name: "Setup: create client A (201)"
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/clients"
  headers:
    - name: Content-Type
      value: "application/json"
    - name: X-Internal-Access-Key
      value: "{{adminKey}}"
  body:
    type: json
    data: |-
      {
        "name": "bruno boundary A",
        "rpId": "localhost",
        "origins": ["http://localhost:3000"]
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          bru.setVar("clientKey", res.getBody().accessKey);
          bru.setVar("clientId", res.getBody().clientId);
        }
    - type: tests
      code: |-
        test("201 — client created", function() {
          expect(res.getStatus()).to.equal(201);
        });

        test("the key is returned once, here", function() {
          const k = res.getBody().accessKey;
          expect(typeof k === "string" && k.length > 0, "accessKey missing").to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **Setup, expected: 201.** Creates a throwaway client so the failures below have
  a real key to fail with. Captures `clientKey` and `clientId`
  (`02-clients/01-create` overwrites both later).

  > **On prd this creates a real client.** Deleting a client is out of v1; it
  > stays until `99-purge.sh`. Do not run this folder against prd casually.
