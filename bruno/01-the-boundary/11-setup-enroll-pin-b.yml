info:
  name: "Setup: enroll PIN on client B (201)"
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/api/factors/pin"
  headers:
    - name: Content-Type
      value: "application/json"
    - name: X-Internal-Access-Key
      value: "{{otherClientKey}}"
  body:
    type: json
    data: |-
      { "subjectId": "{{subjectId}}", "pin": "482916" }

runtime:
  scripts:
    - type: tests
      code: |-
        test("201 — PIN set", function() {
          expect(res.getStatus()).to.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **Setup, expected: 201.** The same subject id, on client B. Subjects are scoped
  per client, so this is a different person as far as auth-gate is concerned.
