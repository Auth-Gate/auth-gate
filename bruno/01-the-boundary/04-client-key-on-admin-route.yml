info:
  name: "Client key on an admin route (401)"
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/clients/{{clientId}}"
  headers:
    - name: X-Internal-Access-Key
      value: "{{clientKey}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("401 — the client key is not the admin key", function() {
          expect(res.getStatus()).to.equal(401);
        });

        test('body is exactly {"error":"unauthorized"}', function() {
          expect(res.getBody()).to.deep.equal({ error: "unauthorized" });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Reads a client using the **client** key instead of the admin key.
  **Expected: 401.**

  Admin routes go to a different Lambda function with its own key. A client
  backend that leaks its key leaks one client, not the ability to create or
  rotate others. Harmless on prd.
