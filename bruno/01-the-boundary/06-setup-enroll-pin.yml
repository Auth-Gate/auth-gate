info:
  name: "Setup: enroll PIN (201)"
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/factors/pin"
  headers:
    - name: Content-Type
      value: "application/json"
    - name: X-Internal-Access-Key
      value: "{{clientKey}}"
  body:
    type: json
    data: |-
      { "subjectId": "{{subjectId}}", "pin": "482916" }

runtime:
  scripts:
    - type: tests
      code: |-
        test("201 — PIN set", function() {
          expect(res.getStatus()).to.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **Setup, expected: 201.** Gives `{{subjectId}}` a PIN on client A so the replay
  below has a challenge to replay.
