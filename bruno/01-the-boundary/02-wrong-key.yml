info:
  name: "Wrong key (401)"
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/factors/{{subjectId}}"
  headers:
    - name: X-Internal-Access-Key
      value: "not-a-real-key"

runtime:
  scripts:
    - type: tests
      code: |-
        test("401 — an unknown key is the same as no key", function() {
          expect(res.getStatus()).to.equal(401);
        });

        test('body is exactly {"error":"unauthorized"}', function() {
          expect(res.getBody()).to.deep.equal({ error: "unauthorized" });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  The same read with a key that matches no client. **Expected: 401.**

  The key is looked up by its SHA-256; an unknown hash is indistinguishable from
  a missing key, on purpose. Harmless on prd.
