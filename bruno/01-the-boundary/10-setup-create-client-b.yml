info:
  name: "Setup: create client B (201)"
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/api/clients"
  headers:
    - name: Content-Type
      value: "application/json"
    - name: X-Internal-Access-Key
      value: "{{adminKey}}"
  body:
    type: json
    data: |-
      {
        "name": "bruno boundary B",
        "rpId": "localhost",
        "origins": ["http://localhost:3000"]
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) bru.setVar("otherClientKey", res.getBody().accessKey);
    - type: tests
      code: |-
        test("201 — client created", function() {
          expect(res.getStatus()).to.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **Setup, expected: 201.** A second client. Captures its key as `otherClientKey`;
  it is used only by the next two requests.

  > **On prd this creates a real client**, as `03` does.
