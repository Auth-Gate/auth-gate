info:
  name: "No /health (404)"
  type: http
  seq: 14

http:
  method: GET
  url: "{{baseUrl}}/health"
  headers:
    - name: X-Internal-Access-Key
      value: "{{clientKey}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("404 — there is no health endpoint", function() {
          expect(res.getStatus()).to.equal(404);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  `GET /health` with a valid client key. **Expected: 404.**

  There is no `/health` or `/version` on any role: the last time this platform
  shipped one it leaked the environment. The valid key is sent so the 404 is the
  route being absent, not the 401 for a missing key. Harmless on prd.
